<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    {% load static %}
    <script type="module" src="{% static 'js/loadTheme.js' %}"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{% static 'styles/themes.css' %}">
    <link rel="stylesheet" href="{% static 'styles/global.css' %}">
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'styles/forms.css' %}">
    <link rel="stylesheet" href="{% static 'styles/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'styles/tables.css' %}">
    <title>WatchStock - {% block title %}{% endblock %}</title>
</head>
<body>
    {% if user.is_authenticated %}
    {% include 'components/header.html' %}
    {% endif %}
    
    <main class="container flex-row">
        <div class="container pi-2">
            {% block content %}
            {% endblock %}
        </div>
    </main>
</body>
</html>
