{% extends 'base.html' %}
{% load static %}

{% block title %}
Adicionar Produtos
{% endblock %}

{% block content %}
<div class="d-flex flex-column pi-4">
    <h1>Adicionar Produtos</h1>
    <form action="./" method="post" class="d-flex flex-row gap-3">
        <div class="d-flex flex-column">
            <label for="name" class="form-label">Nome do produto</label>
            <input type="text" id="name" name="name" class="form-control">

            <label for="description" class="form-label">Descrição do produto</label>
            <input type="text" id="description" name="description" class="form-control">
        </div>
        <div class="d-flex flex-column">
            <label for="value" class="form-label">Valor do produto</label>
            <input type="text" id="value" name="value" class="form-control">
    
            <label for="quantity" class="form-label">Quantidade de produtos</label>
            <input type="text" id="quantity" name="quantity" class="form-control">
        </div>
    </form>
</div>
{% endblock %}
